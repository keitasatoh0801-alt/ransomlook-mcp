name: Update RansomLook data

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ransomlook-intelligence-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch RansomLook
        env:
          RANSOMLOOK_DAYS: "30"
        run: python scripts/fetch_ransomlook.py

      - name: Fetch Japanese cyber incidents
        run: python scripts/fetch_japan_incidents.py

      - name: Build Excel
        run: |
          python -m pip install --disable-pip-version-check openpyxl
          python - <<'PY'
          import json, re
          from openpyxl import Workbook
          from openpyxl.utils import get_column_letter
          with open("data/incidents.json", encoding="utf-8") as f:
              data = json.load(f)
          def org_name(x):
              return (x.get("organization") or "企業・組織名要確認").strip()

          wb=Workbook(); ws=wb.active; ws.title="国内サイバーインシデント"
          ws.append(["公表日","企業・組織名","サービス・システム","インシデント概要","攻撃種別","情報漏えい","漏えい件数","漏えい情報","情報源","情報源数","統合済み","記事URL"])
          for x in data["incidents"]:
              records=x.get("source_records",[x])
              urls=" / ".join(dict.fromkeys(r.get("source_url","") for r in records if r.get("source_url")))
              sources=" / ".join(x.get("sources",[x.get("source","")]))
              leaked=", ".join(x.get("leaked_data",[])) if isinstance(x.get("leaked_data"),list) else x.get("leaked_data","")
              summary=x.get("incident_summary") or x.get("title","")
              ws.append([x.get("published_date",""),org_name(x),x.get("service",""),summary,x.get("attack_type",""),x.get("leak_status",""),x.get("leak_count",""),leaked,sources,x.get("source_count",len(x.get("sources",[x.get("source","")]))),"Yes" if x.get("merged") else "No",urls])
          ws.freeze_panes="A2"; ws.auto_filter.ref=ws.dimensions
          for i,w in enumerate([12,30,34,90,22,18,16,42,32,10,10,90],1): ws.column_dimensions[get_column_letter(i)].width=w
          s=wb.create_sheet("概要")
          s.append(["項目","内容"]); s.append(["抽出期間",f'{data["cutoff_date"]} ～ {data["retrieved_at"][:10]}']); s.append(["統合後インシデント数",data["count"]]); s.append(["対象ソース"," / ".join(data["sources"])]); s.append(["統合ルール",data["deduplication"]["cross_source_rule"]]); s.append(["取得日時",data["retrieved_at"]])
          wb.save("japan_cyber_incidents_1month.xlsx")
          PY

      - name: Commit updated data and Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recent_posts.json data/incidents.json japan_cyber_incidents_1month.xlsx
          if git diff --cached --quiet; then
            echo "No intelligence changes."
            exit 0
          fi
          git commit -m "Update cyber incident intelligence"
          git pull --rebase --strategy-option=theirs origin main
          git push
