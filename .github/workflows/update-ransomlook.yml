name: Update RansomLook data

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch RansomLook
        env:
          RANSOMLOOK_DAYS: "30"
        run: python scripts/fetch_ransomlook.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recent_posts.json
          if git diff --cached --quiet; then
            echo "No RansomLook changes."
            exit 0
          fi
          git commit -m "Update RansomLook intelligence data"
          git push
